<style>
  /* ============================================================
     КАСТОМНЫЙ TOOLTIP (отдельный div)
     ============================================================ */
  .custom-tooltip {
    position: fixed;
    top: 0;
    left: 0;

    /* Внешний вид в стиле остальных элементов */
    background: #1a1c20;
    color: #e0e0e0;
    border: 1px solid #3a3d44;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: "Tektur-Regular";
    font-size: 14px;
    line-height: 1.3;
    white-space: nowrap;

    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5),
                0 0 12px rgba(116, 192, 252, 0.15);

    /* Чтобы не мешал кликам */
    pointer-events: none;

    /* Скрыт по умолчанию */
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease,
                visibility 0.15s ease,
                transform 0.15s ease;

    /* Поверх всего */
    z-index: 2147483647;

    /* Сдвиг для анимации появления */
    transform: translate(-50%, calc(-100% - 6px)) translateY(4px);
  }

  .custom-tooltip.visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, calc(-100% - 6px)) translateY(0);
  }

  /* Стрелочка внизу */
  .custom-tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #3a3d44;
    margin-top: -1px;
  }

  /* Цветные варианты (по желанию) */
  .custom-tooltip[data-color="green"] {
    border-color: #69db7c;
    color: #69db7c;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5),
                0 0 12px rgba(105, 219, 124, 0.35);
  }
  .custom-tooltip[data-color="green"]::after { border-top-color: #69db7c; }

  .custom-tooltip[data-color="red"] {
    border-color: #ff6b6b;
    color: #ff6b6b;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5),
                0 0 12px rgba(255, 107, 107, 0.35);
  }
  .custom-tooltip[data-color="red"]::after { border-top-color: #ff6b6b; }
</style>
